<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >

        <!-- Objeto que será movido, escalado e girado -->
        <a-entity id="objeto" position="0 1 -4" rotation="0 -90 0">
            <a-gltf-model 
                id="modelo"
                src="./glb/casa_10x8.glb"
                scale="0.0008 0.0008 0.0008">
            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        let dragging = false;
        let pinchStartDistance = 0;
        let initialScale = 0.0008;

        let initialAngle = 0;
        let currentRotationY = -90;

        const objeto = document.querySelector("#objeto").object3D;
        const modelo = document.querySelector("#modelo");

        // Distância entre dois dedos
        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Ângulo entre dois dedos
        function getPinchAngle(e) {
            const dx = e.touches[1].clientX - e.touches[0].clientX;
            const dy = e.touches[1].clientY - e.touches[0].clientY;
            return Math.atan2(dy, dx);
        }

        // Início do toque
        window.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                dragging = true;
            } else if (e.touches.length === 2) {
                pinchStartDistance = getPinchDistance(e);
                initialScale = modelo.getAttribute("scale").x;

                initialAngle = getPinchAngle(e);
            }
        });

        // Fim do toque
        window.addEventListener("touchend", () => {
            dragging = false;
        });

        // Movimento
        window.addEventListener("touchmove", e => {

            // PINÇA (zoom + rotação)
            if (e.touches.length === 2) {

                // Zoom
                const pinchDistance = getPinchDistance(e);
                const scaleFactor = pinchDistance / pinchStartDistance;
                const newScale = initialScale * scaleFactor;

                modelo.setAttribute("scale", {
                    x: newScale,
                    y: newScale,
                    z: newScale
                });

                // Rotação
                const angle = getPinchAngle(e);
                const angleDiff = angle - initialAngle;

                const degrees = THREE.Math.radToDeg(angleDiff);

                objeto.rotation.y = currentRotationY + degrees;

                return;
            }

            // ARRASTAR (mover)
            if (!dragging || e.touches.length !== 1) return;

            const touch = e.touches[0];

            const x = (touch.clientX / window.innerWidth) * 2 - 1;
            const y = -(touch.clientY / window.innerHeight) * 2 + 1;

            const camera = document.querySelector("a-camera").object3D;

            const vector = new THREE.Vector3(x, y, -1);
            vector.unproject(camera);

            const distance = 3;

            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            objeto.position.copy(newPos);
        });

        // Salva rotação final ao soltar os dedos
        window.addEventListener("touchend", () => {
            currentRotationY = objeto.rotation.y;
        });

    </script>

</body>

</html>
