<html>

<head>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <!-- Componente look-at -->
  <script>
    AFRAME.registerComponent('look-at-camera', {
      tick: function () {
        const camera = document.querySelector('[gps-camera]');
        if (camera) {
          this.el.object3D.lookAt(camera.object3D.position);
        }
      }
    });
  </script>
</head>

<body style="margin: 0; overflow: hidden;">
  <a-scene vr-mode-ui="enabled: false" embedded arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;">


    <a-entity gps-entity-place="latitude: -20.541734; longitude: -47.453496;">
      <a-image src="cracha.png" scale="1 2 1" position="0 5 0" look-at-camera>
      </a-image>
    </a-entity>

    <a-camera gps-camera rotation-reader></a-camera>

  </a-scene>
</body>

</html>
