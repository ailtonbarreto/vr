<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>

    <style>
        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 9999;
        }

        .btn {
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 20px;
            user-select: none;
        }

        .btn:active {
            background: rgba(0,0,0,0.9);
        }
    </style>
</head>

<body style="margin: 0; overflow: hidden;">

    <div class="controls">
        <div class="btn" id="rotateLeft">⟲</div>
        <div class="btn" id="rotateRight">⟳</div>
    </div>

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >

        <a-entity id="objeto" position="0 1 -4" rotation="0 -90 0">
            <a-gltf-model 
                id="modelo"
                src="./glb/casa_10x8.glb"
                scale="0.0008 0.0008 0.0008">
            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        let dragging = false;
        let pinchStartDistance = 0;
        let initialScale = 0.0008;

        const objeto = document.querySelector("#objeto").object3D;
        const modelo = document.querySelector("#modelo");

        /* -------------------------
           ZOOM COM PINÇA
        -------------------------- */

        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        window.addEventListener("touchstart", e => {
            if (e.touches.length === 2) {
                pinchStartDistance = getPinchDistance(e);
                initialScale = modelo.getAttribute("scale").x;
            } else if (e.touches.length === 1) {
                dragging = true;
            }
        });

        window.addEventListener("touchend", () => dragging = false);

        window.addEventListener("touchmove", e => {

            // ZOOM
            if (e.touches.length === 2) {
                const pinchDistance = getPinchDistance(e);
                const scaleFactor = pinchDistance / pinchStartDistance;
                const newScale = initialScale * scaleFactor;

                modelo.setAttribute("scale", {
                    x: newScale,
                    y: newScale,
                    z: newScale
                });

                return;
            }

            // MOVER X + Y + manter Z fixo
            if (!dragging || e.touches.length !== 1) return;

            const touch = e.touches[0];

            const xNorm = (touch.clientX / window.innerWidth) * 2 - 1;
            const yNorm = -(touch.clientY / window.innerHeight) * 2 + 1;

            const camera = document.querySelector("a-camera").object3D;

            const vector = new THREE.Vector3(xNorm, yNorm, -1);
            vector.unproject(camera);

            const distance = 3; // distância fixa da câmera

            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            objeto.position.copy(newPos);
        });

        /* -------------------------
           BOTÕES DE ROTAÇÃO
        -------------------------- */

        const rotateLeft = document.querySelector("#rotateLeft");
        const rotateRight = document.querySelector("#rotateRight");

        rotateLeft.addEventListener("click", () => {
            objeto.rotation.y += THREE.Math.degToRad(10);
        });

        rotateRight.addEventListener("click", () => {
            objeto.rotation.y -= THREE.Math.degToRad(10);
        });

    </script>

</body>

</html>
