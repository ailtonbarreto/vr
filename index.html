<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >

        <!-- Objeto que será movido e escalado -->
        <a-entity id="objeto" position="0 2 -4">
            <a-gltf-model 
                id="modelo"
                src="./glb/sofa.glb"
                scale="1 1 1">
            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        let dragging = false;
        let pinchStartDistance = 0;
        let initialScale = 0.003;

        const objeto = document.querySelector("#objeto").object3D;
        const modelo = document.querySelector("#modelo");

        // Função para calcular distância entre dois dedos
        function getPinchDistance(e) {
            const dx = e.touches[0].clientX - e.touches[1].clientX;
            const dy = e.touches[0].clientY - e.touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Início do toque
        window.addEventListener("touchstart", e => {
            if (e.touches.length === 1) {
                dragging = true;
            } else if (e.touches.length === 2) {
                pinchStartDistance = getPinchDistance(e);
                initialScale = modelo.getAttribute("scale").x;
            }
        });

        // Fim do toque
        window.addEventListener("touchend", e => {
            dragging = false;
        });

        // Movimento do toque
        window.addEventListener("touchmove", e => {

            // PINÇA (zoom)
            if (e.touches.length === 2) {
                const pinchDistance = getPinchDistance(e);
                const scaleFactor = pinchDistance / pinchStartDistance;

                const newScale = initialScale * scaleFactor;

                modelo.setAttribute("scale", {
                    x: newScale,
                    y: newScale,
                    z: newScale
                });

                return;
            }

            // ARRASTAR (mover)
            if (!dragging || e.touches.length !== 1) return;

            const touch = e.touches[0];

            const x = touch.clientX / window.innerWidth;
            const y = touch.clientY / window.innerHeight;

            const camera = document.querySelector("a-camera").object3D;

            const vector = new THREE.Vector3(
                (x - 0.5) * 2,
                -(y - 0.5) * 2,
                -1
            );

            vector.unproject(camera);

            const distance = 3;

            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            newPos.y = camera.position.y - 1.6;

            objeto.position.copy(newPos);
        });
    </script>

</body>

</html>
