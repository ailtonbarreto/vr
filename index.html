<html>

<head>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >

        <!-- Objeto que será movido pelo toque -->
        <a-entity id="objeto" position="0 2 -4">
            <a-gltf-model 
                src="./glb/sofa.glb"
                scale="1 1 1">
            </a-gltf-model>
        </a-entity>

        <a-camera></a-camera>

    </a-scene>

    <script>
        // Quando o usuário toca na tela
        window.addEventListener("touchstart", function (e) {

            const touch = e.touches[0];

            // Normaliza coordenadas da tela (0 a 1)
            const x = touch.clientX / window.innerWidth;
            const y = touch.clientY / window.innerHeight;

            // Converte para coordenadas 3D
            const camera = document.querySelector("a-camera").object3D;
            const objeto = document.querySelector("#objeto").object3D;

            // Cria um vetor na direção do toque
            const vector = new THREE.Vector3(
                (x - 0.5) * 2,
                -(y - 0.5) * 2,
                -1
            );

            vector.unproject(camera);

            // Define distância fixa (3 metros)
            const distance = 3;

            // Calcula nova posição
            const dir = vector.sub(camera.position).normalize();
            const newPos = camera.position.clone().add(dir.multiplyScalar(distance));

            // Coloca o objeto no chão (Y = -1.6)
            newPos.y = camera.position.y - 1.6;

            // Atualiza posição do objeto
            objeto.position.copy(newPos);
        });
    </script>

</body>

</html>
