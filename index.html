<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="menu.css">
    <script src="menu.js" defer></script>
    <style>
        #locationDialog {
            position: fixed;
            inset: 0;
            z-index: 20000;
            display: grid;
            place-items: center;
            padding: 16px;
            background: rgba(15, 23, 42, 0.72);
            font-family: Arial, sans-serif;
        }

        #locationDialog[hidden] {
            display: none;
        }

        .location-dialog-card {
            width: min(620px, 100%);
            max-height: 100%;
            overflow-y: auto;
            padding: 20px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
        }

        .location-dialog-card h1 {
            margin-bottom: 8px;
            color: #111827;
            font-size: 22px;
        }

        .location-dialog-card p {
            margin-bottom: 12px;
            color: #374151;
            line-height: 1.45;
        }

        #locationMap {
            width: 100%;
            height: min(48vh, 400px);
            min-height: 250px;
            margin: 12px 0;
            border-radius: 10px;
            background: #e5e7eb;
        }

        #locationPickerStatus {
            min-height: 20px;
            font-size: 14px;
        }

        .location-dialog-actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 14px;
        }

        .location-dialog-actions button {
            min-height: 44px;
            padding: 10px 14px;
            border: 0;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        #locateUserButton {
            margin-right: auto;
            color: #111827;
            background: #e5e7eb;
        }

        #confirmLocationButton {
            color: #fff;
            background: #047857;
        }

        #continueWithoutLocationButton {
            color: #374151;
            background: transparent;
        }

        #navigationPanel {
            position: fixed;
            z-index: 9998;
            left: 50%;
            bottom: max(20px, env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 14px;
            width: min(440px, calc(100% - 32px));
            padding: 14px;
            color: #fff;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 18px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
            font-family: Arial, sans-serif;
            transform: translateX(-50%);
            backdrop-filter: blur(8px);
        }

        .direction-orb {
            display: grid;
            flex: 0 0 58px;
            width: 58px;
            height: 58px;
            place-items: center;
            background: rgba(255, 255, 255, 0.13);
            border: 1px solid rgba(255, 255, 255, 0.24);
            border-radius: 50%;
        }

        #directionArrow {
            width: 30px;
            height: 38px;
            background: #45d6ff;
            clip-path: polygon(50% 0, 100% 100%, 50% 78%, 0 100%);
            filter: drop-shadow(0 0 5px rgba(69, 214, 255, 0.8));
            transform: rotate(0deg);
            transition: transform 180ms ease-out;
        }

        .navigation-copy {
            display: flex;
            flex: 1;
            min-width: 0;
            flex-direction: column;
            gap: 5px;
        }

        #navigationDistance {
            font-size: 17px;
        }

        #navigationStatus {
            color: #d1d5db;
            font-size: 13px;
            line-height: 1.3;
        }

        #navigationButton {
            min-height: 42px;
            padding: 0 13px;
            color: #06202a;
            background: #45d6ff;
            border: 0;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #navigationButton:disabled {
            cursor: wait;
            opacity: 0.65;
        }

        #objectSizeControls {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 9998;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px;
            color: #fff;
            background: rgba(15, 23, 42, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
            font-family: Arial, sans-serif;
        }

        #objectSizeControls button {
            width: 42px;
            height: 42px;
            color: #06202a;
            background: #45d6ff;
            border: 0;
            border-radius: 8px;
            font-size: 24px;
            font-weight: 700;
            cursor: pointer;
        }

        #objectSizeControls button:disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        #objectSizeLabel {
            min-width: 82px;
            text-align: center;
            font-size: 13px;
            white-space: nowrap;
        }

        @media (max-width: 420px) {
            #navigationPanel {
                gap: 10px;
                padding: 11px;
            }

            .direction-orb {
                flex-basis: 48px;
                width: 48px;
                height: 48px;
            }

            #navigationButton {
                padding: 0 10px;
                font-size: 13px;
            }

            #objectSizeControls {
                top: 12px;
                right: 12px;
                gap: 6px;
                padding: 6px;
            }

            #objectSizeControls button {
                width: 38px;
                height: 38px;
            }
        }
    </style>
    <title>AR com GPS</title>
</head>

<body style="margin: 0; overflow: hidden;">

    <section id="locationDialog" role="dialog" aria-modal="true" aria-labelledby="locationDialogTitle">
        <div class="location-dialog-card">
            <h1 id="locationDialogTitle">Defina a posição do objeto</h1>
            <p>Use sua localização para centralizar o mapa. Toque no mapa ou arraste o marcador para escolher onde o objeto ficará.</p>
            <div id="locationMap" aria-label="Mapa para selecionar a posição do objeto"></div>
            <p id="locationPickerStatus" role="status" aria-live="polite">
                Obtendo sua localização para centralizar o mapa...
            </p>
            <div class="location-dialog-actions">
                <button id="locateUserButton" type="button">Usar minha localização</button>
                <button id="continueWithoutLocationButton" type="button">Continuar sem alterar</button>
                <button id="confirmLocationButton" type="button">Confirmar posição</button>
            </div>
        </div>
    </section>

    <span class="material-symbols-outlined open-menu" id="open_menu" aria-label="Abrir menu">menu</span>

    <nav id="menu" aria-label="Selecionar modelo">
        <span class="material-symbols-outlined" id="close_menu" aria-label="Fechar menu">close</span>

        <div id="modelButtons">

            <button class="model-btn active" data-src="./itens/eiffel_tower.glb">Torre Eiffel</button>
            <button class="model-btn" data-src="./itens/lamborghini_aventador.glb">Lamborghini Aventador</button>
            <button class="model-btn" data-src="./itens/ferrari_f430.glb">Ferrari F430</button>
            <button class="model-btn" data-src="./itens/sukhoi.glb">Caça Sukhoi</button>
            <button class="model-btn" data-src="./itens/wtc.glb">World Trade Center</button>
            <button class="model-btn" data-src="./itens/torre_picasso_madrid.glb">Torre Picasso</button>
            <button class="model-btn" data-src="./itens/Burj_al_arab.glb">Burj Al Arab</button>
            
        </div>
    </nav>

    <div id="objectSizeControls" role="group" aria-label="Tamanho do objeto">
        <button id="decreaseObjectSize" type="button" aria-label="Diminuir tamanho do objeto">−</button>
        <span id="objectSizeLabel" role="status" aria-live="polite">Tamanho: 100%</span>
        <button id="increaseObjectSize" type="button" aria-label="Aumentar tamanho do objeto">+</button>
    </div>

    <section id="navigationPanel" aria-label="Navegação até o objeto">
        <div class="direction-orb" aria-hidden="true">
            <span id="directionArrow"></span>
        </div>
        <div class="navigation-copy">
            <strong id="navigationDistance">Destino definido</strong>
            <span id="navigationStatus" role="status" aria-live="polite">
                Inicie para apontar a seta na direção do objeto.
            </span>
        </div>
        <button id="navigationButton" type="button">Iniciar</button>
    </section>

    <a-scene
        vr-mode-ui="enabled: false"
        embedded
        arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >
        <a-camera gps-camera rotation-reader></a-camera>

        <a-entity id="objeto"
            gps-entity-place="latitude: ; longitude: ; altitude: ">
            <a-gltf-model id="modelo" src="./itens/eiffel_tower.glb" scale="2 2 2"
                rotation="0 45 0"></a-gltf-model>
        </a-entity>
    </a-scene>

    <script>
        const modelo = document.querySelector("#modelo");
        const decreaseObjectSizeButton = document.querySelector("#decreaseObjectSize");
        const increaseObjectSizeButton = document.querySelector("#increaseObjectSize");
        const objectSizeLabel = document.querySelector("#objectSizeLabel");
        const gpsEntity = document.querySelector("#objeto");
        const modelMenu = document.querySelector("#menu");
        const modelButtons = document.querySelectorAll(".model-btn");
        const navigationButton = document.querySelector("#navigationButton");
        const navigationStatus = document.querySelector("#navigationStatus");
        const navigationDistance = document.querySelector("#navigationDistance");
        const directionArrow = document.querySelector("#directionArrow");
        const locationDialog = document.querySelector("#locationDialog");
        const locationPickerStatus = document.querySelector("#locationPickerStatus");
        const locateUserButton = document.querySelector("#locateUserButton");
        const confirmLocationButton = document.querySelector("#confirmLocationButton");
        const defaultDestination = { latitude: -20.546606, longitude: -47.4173892, altitude: 210 };
        const locationMap = L.map("locationMap").setView(
            [defaultDestination.latitude, defaultDestination.longitude],
            15
        );
        let destinationMarker;
        let userMarker = null;
        let selectedDestination = { ...defaultDestination };
        let destinationSelectedManually = false;
        let currentPosition = null;
        let currentHeading = null;
        let locationWatchId = null;
        let navigationActive = false;
        let locationError = null;
        let compassMessage = "Aponte o topo do celular para encontrar a direção.";
        let objectScaleFactor = 1;
        const minimumObjectScale = 0.1;
        const maximumObjectScale = 5;

        function updateObjectScale() {
            const scale = 2 * objectScaleFactor;
            modelo.setAttribute("scale", `${scale} ${scale} ${scale}`);
            objectSizeLabel.textContent = `Tamanho: ${Math.round(objectScaleFactor * 100)}%`;
            decreaseObjectSizeButton.disabled = objectScaleFactor <= minimumObjectScale;
            increaseObjectSizeButton.disabled = objectScaleFactor >= maximumObjectScale;
        }

        decreaseObjectSizeButton.addEventListener("click", () => {
            objectScaleFactor = Math.max(minimumObjectScale, objectScaleFactor / 1.2);
            updateObjectScale();
        });

        increaseObjectSizeButton.addEventListener("click", () => {
            objectScaleFactor = Math.min(maximumObjectScale, objectScaleFactor * 1.2);
            updateObjectScale();
        });

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(locationMap);

        destinationMarker = L.marker(
            [selectedDestination.latitude, selectedDestination.longitude],
            { draggable: true }
        ).addTo(locationMap);

        function updateSelectedDestination(latitude, longitude) {
            selectedDestination = {
                latitude,
                longitude,
                altitude: defaultDestination.altitude
            };
            destinationMarker.setLatLng([latitude, longitude]);
            locationPickerStatus.textContent =
                `Posição do objeto: ${latitude.toFixed(6)}, ${longitude.toFixed(6)}.`;
        }

        locationMap.on("click", event => {
            destinationSelectedManually = true;
            updateSelectedDestination(event.latlng.lat, event.latlng.lng);
        });

        destinationMarker.on("dragend", () => {
            const position = destinationMarker.getLatLng();
            destinationSelectedManually = true;
            updateSelectedDestination(position.lat, position.lng);
        });

        function locateUser(selectUserLocationAsDestination) {
            if (!navigator.geolocation) {
                locationPickerStatus.textContent =
                    "Este navegador não disponibiliza localização. Você ainda pode marcar o objeto no mapa.";
                locateUserButton.disabled = false;
                return;
            }

            locateUserButton.disabled = true;
            locationPickerStatus.textContent = "Obtendo sua localização...";
            navigator.geolocation.getCurrentPosition(position => {
                currentPosition = {
                    latitude: position.coords.latitude,
                    longitude: position.coords.longitude
                };
                if (userMarker) {
                    userMarker.setLatLng([currentPosition.latitude, currentPosition.longitude]);
                } else {
                    userMarker = L.circleMarker(
                        [currentPosition.latitude, currentPosition.longitude],
                        { radius: 8, color: "#fff", weight: 2, fillColor: "#2563eb", fillOpacity: 1 }
                    ).addTo(locationMap).bindPopup("Sua localização");
                }
                if (selectUserLocationAsDestination && !destinationSelectedManually) {
                    updateSelectedDestination(currentPosition.latitude, currentPosition.longitude);
                }
                locationMap.setView(
                    [currentPosition.latitude, currentPosition.longitude],
                    17
                );
                locateUserButton.disabled = false;
                locationPickerStatus.textContent =
                    selectUserLocationAsDestination && !destinationSelectedManually
                        ? "Mapa centralizado na sua localização. O marcador do objeto começou ali; mova-o se necessário."
                        : "Sua localização está no mapa. Toque ou arraste o marcador para definir o objeto.";
                updateNavigation();
            }, error => {
                const messages = {
                    1: "Acesso à localização negado. Permita o GPS ou marque o objeto manualmente.",
                    2: "Sua localização não está disponível. Tente novamente ou marque o objeto manualmente.",
                    3: "O GPS demorou para responder. Tente novamente ou marque o objeto manualmente."
                };
                locateUserButton.disabled = false;
                locationPickerStatus.textContent =
                    messages[error.code] || "Não foi possível obter sua localização. Marque o objeto no mapa.";
            }, {
                enableHighAccuracy: true,
                maximumAge: 1000,
                timeout: 15000
            });
        }

        locateUserButton.addEventListener("click", () => {
            locateUser(false);
        });

        confirmLocationButton.addEventListener("click", () => {
            gpsEntity.setAttribute(
                "gps-entity-place",
                `latitude: ${selectedDestination.latitude}; longitude: ${selectedDestination.longitude}; altitude: ${selectedDestination.altitude}`
            );
            locationDialog.hidden = true;
            updateNavigation();
        });

        document.querySelector("#continueWithoutLocationButton").addEventListener("click", () => {
            locationDialog.hidden = true;
        });

        requestAnimationFrame(() => locationMap.invalidateSize());
        locateUserButton.disabled = true;
        locateUser(true);

        modelButtons.forEach(button => {
            button.addEventListener("click", () => {
                modelo.setAttribute("src", button.dataset.src);
                modelButtons.forEach(item => item.classList.remove("active"));
                button.classList.add("active");
                modelMenu.classList.remove("open");
            });
        });

        function normalizeAngle(angle) {
            return (angle % 360 + 360) % 360;
        }

        function calculateBearing(lat1, lon1, lat2, lon2) {
            const toRad = angle => angle * Math.PI / 180;
            const toDegrees = angle => angle * 180 / Math.PI;
            const deltaLon = toRad(lon2 - lon1);
            const y = Math.sin(deltaLon) * Math.cos(toRad(lat2));
            const x =
                Math.cos(toRad(lat1)) * Math.sin(toRad(lat2)) -
                Math.sin(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.cos(deltaLon);

            return normalizeAngle(toDegrees(Math.atan2(y, x)));
        }

        function getDestination() {
            const gpsPlace = gpsEntity.components && gpsEntity.components["gps-entity-place"];
            return gpsPlace && gpsPlace.attrValue;
        }

        function updateNavigation() {
            if (!currentPosition) {
                navigationDistance.textContent = "Aguardando GPS...";
                navigationStatus.textContent = locationError || "Obtendo sua localização.";
                return;
            }

            const destination = getDestination();
            if (!destination) {
                navigationStatus.textContent = "Não foi possível localizar o destino.";
                return;
            }

            const distance = calcularDistancia(
                currentPosition.latitude,
                currentPosition.longitude,
                destination.latitude,
                destination.longitude
            );
            navigationDistance.textContent = distance < 1000
                ? `${distance.toFixed(0)} m`
                : `${(distance / 1000).toFixed(2)} km`;

            if (locationError) {
                navigationStatus.textContent = locationError;
                return;
            }

            if (distance < 10) {
                navigationStatus.textContent = "Você chegou ao objeto!";
                return;
            }

            if (currentHeading === null) {
                navigationStatus.textContent = compassMessage;
                return;
            }

            const bearing = calculateBearing(
                currentPosition.latitude,
                currentPosition.longitude,
                destination.latitude,
                destination.longitude
            );
            directionArrow.style.transform = `rotate(${normalizeAngle(bearing - currentHeading)}deg)`;
            navigationStatus.textContent = "Siga a seta até o objeto.";
        }

        function handleOrientation(event) {
            let heading = event.webkitCompassHeading;

            if (!Number.isFinite(heading) && event.absolute && Number.isFinite(event.alpha)) {
                const screenAngle = window.screen.orientation
                    ? window.screen.orientation.angle
                    : 0;
                heading = 360 - event.alpha + screenAngle;
            }

            if (Number.isFinite(heading)) {
                currentHeading = normalizeAngle(heading);
                updateNavigation();
            }
        }

        function stopNavigation(statusMessage) {
            if (locationWatchId !== null) {
                navigator.geolocation.clearWatch(locationWatchId);
                locationWatchId = null;
            }

            window.removeEventListener("deviceorientation", handleOrientation);
            window.removeEventListener("deviceorientationabsolute", handleOrientation);
            currentHeading = null;
            directionArrow.style.transform = "rotate(0deg)";
            navigationActive = false;
            navigationButton.disabled = false;
            navigationButton.textContent = "Iniciar";
            locationError = statusMessage || null;
            updateNavigation();
        }

        async function startNavigation() {
            navigationButton.disabled = true;
            navigationStatus.textContent = "Solicitando acesso ao GPS e à bússola...";
            locationError = null;

            if (typeof DeviceOrientationEvent !== "undefined" &&
                typeof DeviceOrientationEvent.requestPermission === "function") {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === "granted") {
                        compassMessage = "Aponte o topo do celular para encontrar a direção.";
                    } else {
                        compassMessage = "Permita o acesso à orientação do aparelho para usar a seta.";
                    }
                } catch (error) {
                    compassMessage = "Não foi possível ativar a bússola. Verifique a permissão do aparelho.";
                }
            } else if (typeof DeviceOrientationEvent === "undefined") {
                compassMessage = "Este aparelho ou navegador não disponibiliza bússola.";
            }

            if (!navigator.geolocation) {
                stopNavigation("Este navegador não disponibiliza localização GPS.");
                return;
            }

            window.addEventListener("deviceorientation", handleOrientation);
            window.addEventListener("deviceorientationabsolute", handleOrientation);
            navigationActive = true;
            navigationButton.disabled = false;
            navigationButton.textContent = "Parar";
            navigationStatus.textContent = "Obtendo sua localização...";

            try {
                locationWatchId = navigator.geolocation.watchPosition(position => {
                    currentPosition = {
                        latitude: position.coords.latitude,
                        longitude: position.coords.longitude
                    };
                    locationError = null;
                    updateNavigation();
                }, error => {
                    const messages = {
                        1: "Permita o acesso à localização para iniciar a navegação.",
                        2: "Sua localização não está disponível. Tente novamente em um local aberto.",
                        3: "O GPS demorou para responder. Verifique o sinal e tente novamente."
                    };
                    locationError = messages[error.code] || "Não foi possível obter sua localização.";
                    updateNavigation();
                }, {
                    enableHighAccuracy: true,
                    maximumAge: 1000,
                    timeout: 15000
                });
            } catch (error) {
                stopNavigation("Falha ao iniciar o GPS. Verifique as permissões e tente novamente.");
                return;
            }

            updateNavigation();
        }

        navigationButton.addEventListener("click", () => {
            if (navigationActive) {
                stopNavigation("Navegação pausada.");
                return;
            }

            startNavigation();
        });

        function calcularDistancia(lat1, lon1, lat2, lon2) {
            const R = 6371e3;
            const toRad = x => x * Math.PI / 180;

            const dLat = toRad(lat2 - lat1);
            const dLon = toRad(lon2 - lon1);

            const a =
                Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLon / 2) * Math.sin(dLon / 2);

            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

            return R * c;
        }

        window.addEventListener('gps-camera-update-position', e => {
            const userLat = e.detail.position.latitude;
            const userLon = e.detail.position.longitude;

            currentPosition = { latitude: userLat, longitude: userLon };
            updateNavigation();
        });
    </script>

</body>

</html>
