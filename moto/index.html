<html>
  <head>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <!-- Componente de âncora fixa -->
    <script>
      AFRAME.registerComponent('fixed-anchor', {
        init: function () {
          const el = this.el;

          // Aguarda a primeira posição do GPS
          const handler = function (e) {
            const lat = e.detail.position.latitude;
            const lon = e.detail.position.longitude;

            // Define a posição inicial da âncora
            el.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);

            // Remove atualizações futuras (âncora fixa)
            window.removeEventListener('gps-camera-update-position', handler);
          };

          window.addEventListener('gps-camera-update-position', handler);
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
    >

      <!-- Âncora fixa da moto -->
      <a-entity fixed-anchor>
        <a-gltf-model
          src="kawasaki_ninja_zx-6r.glb"
          scale="1 1 1"
          rotation="0 0 0"
        ></a-gltf-model>
      </a-entity>

      <!-- Câmera com GPS -->
      <a-camera gps-camera rotation-reader></a-camera>

    </a-scene>
  </body>
</html>
